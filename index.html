<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Fuel Surcharge Italia | Benchmark Gasolio Autotrasporto</title>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/0/00/Emblem_of_Italy.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        font-family: 'Titillium Web', sans-serif;
      }
      #loading-screen {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.4s ease-out;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #0284c7;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loading-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 800;
        font-size: 1.2rem;
        letter-spacing: 0.5px;
        color: #0f172a;
        margin-bottom: 6px;
      }
      .loading-sub {
        font-size: 0.85rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="spinner"></div>
      <div class="loading-title">FUEL SURCHARGE ITALIA</div>
      <div class="loading-sub">Inizializzazione motore WebAssembly e dati ufficiali MASE...</div>
    </div>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>
    <script>
      async function initApp() {
        try {
          const timestamp = new Date().getTime();
          // Scarica SEMPRE l'ultima versione senza mai usare cache locale
          const [appCode, calcCode, dataJson] = await Promise.all([
            fetch(`app.py?v=${timestamp}`, { cache: "no-store" }).then(r => {
              if (!r.ok) throw new Error("Impossibile caricare app.py");
              return r.text();
            }),
            fetch(`calculation.py?v=${timestamp}`, { cache: "no-store" }).then(r => {
              if (!r.ok) throw new Error("Impossibile caricare calculation.py");
              return r.text();
            }),
            fetch(`data/gasolio_mase.json?v=${timestamp}`, { cache: "no-store" }).then(r => {
              if (!r.ok) throw new Error("Impossibile caricare gasolio_mase.json");
              return r.text();
            })
          ]);

          stlite.mount(
            {
              requirements: ["pandas", "plotly"],
              entrypoint: "app.py",
              files: {
                "app.py": appCode,
                "calculation.py": calcCode,
                "data/gasolio_mase.json": dataJson
              },
            },
            document.getElementById("root")
          );

          setTimeout(() => {
            const loader = document.getElementById("loading-screen");
            if (loader) {
              loader.style.opacity = "0";
              setTimeout(() => loader.remove(), 400);
            }
          }, 1500);

        } catch (err) {
          console.error(err);
          document.getElementById("loading-screen").innerHTML = `
            <div style="color: #dc2626; text-align: center; padding: 20px;">
              <h3 style="margin-bottom: 8px;">Errore durante il caricamento</h3>
              <p style="color: #64748b; font-size: 0.9rem;">${err.message}</p>
            </div>
          `;
        }
      }
      initApp();
    </script>
  </body>
</html>
