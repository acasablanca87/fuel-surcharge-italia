name: Aggiornamento Dati MASE (Multi-Onda)

on:
  schedule:
    # ⚡ Martedì: scansione ogni 30 min dalle 10:05 UTC (12:05 IT) alle 18:35 UTC (20:35 IT)
    - cron: '5 10-18 * * 2'
    - cron: '35 10-18 * * 2'
    # 🛡️ Safety fallback: mercoledì mattina alle 06:35 UTC (08:35 IT)
    - cron: '35 6 * * 3'
  
  # Consente sempre l'avvio manuale immediato con 1 click dalla scheda Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mase-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Scarica il repository
        uses: actions/checkout@v4

      - name: 🐍 Configura Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: ⚡ Esegui lo script di download MASE
        run: |
          python fetch_data.py

      - name: 💾 Controlla e salva i dati aggiornati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Se il file JSON è stato modificato rispetto a prima, fai commit e push
          if git status --porcelain data/gasolio_mase.json | grep -q "data/gasolio_mase.json"; then
            git add data/gasolio_mase.json
            git commit -m "chore(data): aggiornamento automatico prezzi gasolio MASE"
            git push
            echo "✅ Nuovi dati MASE pubblicati e salvati con successo nel repository!"
          else
            echo "ℹ️ Nessun nuovo dato ministeriale rilevato: il database è già allineato."
          fi
